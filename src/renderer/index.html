<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Locked-down CSP: the renderer only ever runs code bundled at build time. No remote
      origin can be reached, so a pasted prompt cannot cause a network request.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Oxum Prompt Editor</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="app" id="app-root">
      <header class="titlebar" id="titlebar">
        <span class="titlebar__title">
          <span class="titlebar__mark" aria-hidden="true"></span>
          Prompt
        </span>
        <div class="titlebar__actions">
          <!--
            A view mode, not an action, so it belongs with the chrome rather than in the toolbar
            beside the buttons that change the draft. Pressed state says which of the two views
            is on screen, since the editor and the preview never show at the same time.
          -->
          <button
            type="button"
            id="preview-button"
            class="icon-button"
            title="Aperçu Markdown (Ctrl+P)"
            aria-label="Afficher l’aperçu Markdown"
            aria-pressed="false"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M1.3 8s2.5-4.4 6.7-4.4S14.7 8 14.7 8s-2.5 4.4-6.7 4.4S1.3 8 1.3 8z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
              <circle cx="8" cy="8" r="1.9" />
            </svg>
          </button>
          <!--
            A glyph rather than an SVG, for the same reason the format bar draws B and I as
            letters: a question mark is the universally understood sign for help, and no drawing
            of one is clearer than the character itself at 14px.
          -->
          <button
            type="button"
            id="help-button"
            class="icon-button icon-button--glyph"
            title="Raccourcis clavier (F1)"
            aria-label="Afficher les raccourcis clavier"
            aria-pressed="false"
          >
            ?
          </button>
          <button
            type="button"
            id="settings-button"
            class="icon-button"
            title="Réglages (Ctrl+,)"
            aria-label="Ouvrir les réglages"
          >
            <!--
              Sliders rather than a cog: a cog needs its teeth to be recognisable, and at the
              14px this button renders at they collapse into a blob that reads as an asterisk.
              Three tracks with knobs stay legible because the shapes are just bars and dots.
            -->
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="3.3" width="12" height="1.4" rx="0.7" />
              <circle cx="10.5" cy="4" r="2.1" />
              <rect x="2" y="7.3" width="12" height="1.4" rx="0.7" />
              <circle cx="5.5" cy="8" r="2.1" />
              <rect x="2" y="11.3" width="12" height="1.4" rx="0.7" />
              <circle cx="10" cy="12" r="2.1" />
            </svg>
          </button>
          <button
            type="button"
            id="theme-button"
            class="icon-button"
            title="Thème (Ctrl+Maj+D)"
            aria-label="Changer de thème"
          >
            <svg id="theme-icon" viewBox="0 0 16 16" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            id="pin-button"
            class="icon-button"
            title="Garder au premier plan"
            aria-pressed="true"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M9.5 1.5l5 5-1.8.4-2.3 2.3.5 3.6-1.2 1.2-3.1-3.1-3.3 3.3-.7-.7 3.3-3.3-3.1-3.1 1.2-1.2 3.6.5 2.3-2.3z"
              />
            </svg>
          </button>
          <!--
            The X hides, it does not quit. Thirty years of Windows send the cursor here to
            dismiss a popup, and this app is built around a window that hides rather than
            closes. A real quit in this position killed the tray daemon on a misclick, leaving
            nothing on screen to explain why the global shortcut had stopped answering. Quitting
            now lives in the tray menu and at the foot of the settings page, both reached on
            purpose.
          -->
          <button
            type="button"
            id="hide-button"
            class="icon-button"
            title="Masquer (Échap)"
            aria-label="Masquer la fenêtre"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4.3 3.3l8.4 8.4-1 1-8.4-8.4zM12.7 4.3l-8.4 8.4-1-1 8.4-8.4z" />
            </svg>
          </button>
        </div>
      </header>

      <div
        class="format-bar"
        id="format-bar"
        role="toolbar"
        aria-label="Mise en forme Markdown"
      ></div>

      <div class="workspace">
        <main class="editor-pane">
          <div id="editor" class="editor" aria-label="Éditeur de prompt"></div>
          <!--
            The rendered document, shown in place of the editor rather than beside it. The window
            is often under 700px wide, and two columns at that width leaves two unreadable ones.
          -->
          <div
            id="preview"
            class="preview"
            role="document"
            aria-label="Aperçu Markdown"
            tabindex="-1"
            hidden
          ></div>
          <div
            id="token-badge"
            class="token-badge"
            title="Estimation, environ 3,7 caractères par token"
            hidden
          ></div>
        </main>

        <aside class="side-panel" id="side-panel" hidden>
          <div class="side-panel__header">
            <span id="side-panel-title">Réécriture</span>
            <button type="button" id="panel-close" class="icon-button" title="Fermer">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.3 3.3l8.4 8.4-1 1-8.4-8.4zM12.7 4.3l-8.4 8.4-1-1 8.4-8.4z" />
              </svg>
            </button>
          </div>
          <!--
            Tab strip for the three stores. It sits outside the body so it does not scroll away
            with the content, and stays hidden in rewrite mode, which has no sibling to switch to.
          -->
          <div
            class="side-panel__tabs"
            id="side-panel-tabs"
            role="tablist"
            aria-label="Bibliothèque"
            hidden
          ></div>
          <div class="side-panel__body" id="side-panel-body"></div>
          <div class="side-panel__footer" id="side-panel-footer"></div>
        </aside>

        <!--
          The shortcut reference. Same overlay treatment as the settings, and for the same
          reason: two columns of key caps do not fit in a 46% side panel, and the toolbar
          underneath acts on a draft that is no longer on screen.
        -->
        <section class="help-page" id="help-page" hidden aria-label="Raccourcis clavier">
          <div class="help-page__header">
            <span>Raccourcis clavier</span>
            <button
              type="button"
              id="help-close"
              class="icon-button"
              title="Fermer (Échap)"
              aria-label="Fermer les raccourcis"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.3 3.3l8.4 8.4-1 1-8.4-8.4zM12.7 4.3l-8.4 8.4-1-1 8.4-8.4z" />
              </svg>
            </button>
          </div>
          <div class="help-page__body" id="help-page-body" tabindex="-1"></div>
        </section>

        <!--
          Settings cover the whole workspace rather than sharing the side panel: the panel is 46%
          of a window that can be 820px wide, which is not enough for a form carrying one model
          field per action.
        -->
        <section class="settings-page" id="settings-page" hidden aria-label="Réglages">
          <div class="settings-page__header">
            <span>Réglages</span>
            <button
              type="button"
              id="settings-close"
              class="icon-button"
              title="Fermer (Échap)"
              aria-label="Fermer les réglages"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.3 3.3l8.4 8.4-1 1-8.4-8.4zM12.7 4.3l-8.4 8.4-1-1 8.4-8.4z" />
              </svg>
            </button>
          </div>
          <div class="settings-page__body" id="settings-page-body"></div>
          <div class="settings-page__footer">
            <!--
              The deliberate quit path: a page you opened on purpose, not a 26px target beside
              the one that merely hides. The tray menu carries the same action.
            -->
            <button
              type="button"
              id="settings-quit"
              class="button button--quiet settings-page__quit"
            >
              Quitter l’application
            </button>
            <span class="settings-page__dirty" id="settings-dirty"></span>
            <button type="button" id="settings-cancel" class="button">Annuler</button>
            <button type="button" id="settings-save" class="button button--primary" disabled>
              Enregistrer
            </button>
          </div>
        </section>
      </div>

      <footer class="toolbar">
        <div class="toolbar__group">
          <button type="button" id="rewrite-button" class="button button--accent">
            Rédiger le prompt
          </button>
          <select
            id="preset-select"
            class="select"
            title="Mode de réécriture (Ctrl+Maj+R)"
            aria-label="Mode de réécriture"
          ></select>
        </div>
        <div class="toolbar__group">
          <!--
            One opener for the three stores. They share a single panel and are therefore
            mutually exclusive, which three separate toolbar buttons could not express: none of
            them could show that it was the active one. The tab strip inside the panel gets that
            for free, and the vocabulary collapses to one container name.
          -->
          <button
            type="button"
            id="library-button"
            class="button"
            title="Bibliothèque : prompts, notes, historique (Ctrl+L)"
            aria-pressed="false"
          >
            Bibliothèque
          </button>
          <button
            type="button"
            id="open-button"
            class="button"
            title="Ouvrir un fichier Markdown (Ctrl+O)"
          >
            Ouvrir
          </button>
          <button type="button" id="new-button" class="button" title="Nouveau prompt (Ctrl+N)">
            Nouveau
          </button>
          <!--
            The only filled button in the window. Copying ends every single session; rewriting is
            an occasional assist, so it no longer outranks it visually.
          -->
          <button
            type="button"
            id="copy-button"
            class="button button--primary"
            title="Copier et masquer (Ctrl+Entrée)"
          >
            Copier
          </button>
        </div>
      </footer>

      <div class="statusbar">
        <span id="status-counts">0 car.</span>
        <span id="status-save" class="statusbar__save"></span>
        <!--
          Shown only while a file from outside the app is open. It is a button because it is also
          the visible half of Ctrl+S: the one place that says both which file is bound and that
          it has unsaved changes.
        -->
        <button type="button" id="status-file" class="statusbar__file" hidden></button>
        <span id="status-message" class="statusbar__message"></span>
        <span id="status-version" class="statusbar__version"></span>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
